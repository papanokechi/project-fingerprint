name = "pcf-apery3"
defaultTargets = ["Apery3Catalan", "Zeta4Caso", "CasoratianFramework", "FrameworkInstances"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[lean_lib]]
name = "Apery3Catalan"
globs = ["Apery3Catalan"]

[[lean_lib]]
name = "Zeta4Caso"
globs = ["Zeta4Caso"]

[[lean_lib]]
name = "CasoratianFramework"
globs = ["CasoratianFramework"]

[[lean_lib]]
name = "FrameworkInstances"
globs = ["FrameworkInstances"]
