# Configuration for circle packing constructor evolution (n=26)
# Task 03: LOCAL provider (Ollama, OpenAI-compatible) reached from inside the
# container via host.docker.internal. Budget is the operator default: 100 iters.
# Derived from examples/circle_packing/config_phase_1.yaml (codelion/openevolve
# @80945ed); only the LLM/provider block and a few CPU-friendly knobs changed.
max_iterations: 100
checkpoint_interval: 5
log_level: "INFO"

# LLM configuration — LOCAL Ollama, OpenAI-compatible endpoint.
llm:
  primary_model: "qwen2.5-coder:7b"
  primary_model_weight: 1.0
  # Reached from INSIDE the container; NOT localhost (which would mean the
  # container itself). Ollama runs on the Windows host.
  api_base: "http://host.docker.internal:11434/v1"
  # Dummy key: Ollama ignores it but the OpenAI client requires a value.
  # This is NOT a secret.
  api_key: "ollama"
  temperature: 0.7
  top_p: 0.95
  # CPU-only host: qwen2.5-coder:7b generates ~1.8 tok/s. Bound generation length
  # so a single evolve call completes well under the timeout; raise the timeout so
  # slow CPU calls do not spuriously fail. These are hardware-feasibility knobs;
  # they do NOT change the 100-iteration budget or any evaluator tolerance.
  max_tokens: 768
  timeout: 1800

# Prompt configuration
prompt:
  system_message: |
    You are an expert mathematician specializing in circle packing problems and computational geometry. Your task is to improve a constructor function that directly produces a specific arrangement of 26 circles in a unit square, maximizing the sum of their radii. The AlphaEvolve paper achieved a sum of 2.635 for n=26.

    Key geometric insights:
    - Circle packings often follow hexagonal patterns in the densest regions
    - Maximum density for infinite circle packing is pi/(2*sqrt(3)) ≈ 0.9069
    - Edge effects make square container packing harder than infinite packing
    - Circles can be placed in layers or shells when confined to a square
    - Similar radius circles often form regular patterns, while varied radii allow better space utilization
    - Perfect symmetry may not yield the optimal packing due to edge effects

    Focus on designing an explicit constructor that places each circle in a specific position, rather than an iterative search algorithm.
  num_top_programs: 3
  use_template_stochasticity: true

# Database configuration
database:
  population_size: 40
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.7

# Evaluator configuration
evaluator:
  timeout: 60
  cascade_evaluation: true
  cascade_thresholds: [0.5, 0.75]
  # Single-model CPU Ollama serializes requests; one at a time avoids queue
  # contention and per-call timeouts.
  parallel_evaluations: 1
  use_llm_feedback: false

# Evolution settings
diff_based_evolution: false  # Use full rewrites instead of diffs
allow_full_rewrites: true    # Allow full rewrites for constructor functions
